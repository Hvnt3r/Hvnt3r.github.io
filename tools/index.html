<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tools · Hvnt3r</title>
  <style>
    :root { color-scheme: dark; --bg: #0b1020; --panel: #131c34; --text: #edf2ff; --muted: #9da9c7; --line: #2c395e; --accent: #8aa4ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: var(--text); background: var(--bg); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .shell { width: min(820px, calc(100% - 40px)); margin: 0 auto; }
    nav { display: flex; justify-content: space-between; padding: 28px 0; }
    a { color: var(--muted); text-decoration: none; }
    a:hover { color: var(--text); }
    .brand { color: var(--text); font-weight: 700; letter-spacing: .08em; }
    .links { display: flex; gap: 22px; }
    main { padding: 13vh 0 20vh; }
    h1 { margin: 0 0 12px; font-size: clamp(2.4rem, 7vw, 4.8rem); letter-spacing: -.05em; }
    p { color: var(--muted); }
    .card { margin-top: 36px; padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
    .card strong { display: block; margin-bottom: 6px; color: var(--accent); }
    @media (max-width: 560px) { .shell { width: min(100% - 28px, 820px); } }
  </style>
</head>
<body>
  <div class="shell">
    <nav>
      <a class="brand" href="/">HVNT3R</a>
      <div class="links"><a href="/blog/">Blog</a><a href="/tools/">Tools</a></div>
    </nav>
    <main>
      <h1>Tools</h1>
      <p>这里将放置一些由静态页面实现的简单工具。</p>
      <section class="card">
        <strong>Coming soon</strong>
        <span>工具区已预留，后续可以直接在此目录下添加独立的静态工具页面。</span>
      </section>
    </main>
  </div>
</body>
</html>
