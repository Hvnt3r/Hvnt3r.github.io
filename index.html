<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hvnt3r 的个人站点">
  <title>Hvnt3r</title>
  <style>
    :root { color-scheme: dark; --bg: #0b1020; --panel: rgba(19, 28, 52, .78); --text: #edf2ff; --muted: #9da9c7; --line: rgba(157, 169, 199, .2); --accent: #8aa4ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: var(--text); background: radial-gradient(circle at 15% 10%, #1a2d59 0, transparent 36%), radial-gradient(circle at 90% 85%, #282052 0, transparent 32%), var(--bg); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .shell { width: min(960px, calc(100% - 40px)); margin: 0 auto; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 28px 0; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--text); }
    .brand { color: var(--text); font-weight: 700; letter-spacing: .08em; }
    .nav-links { display: flex; gap: 24px; }
    .hero { min-height: calc(100vh - 140px); display: grid; align-content: center; max-width: 720px; padding: 40px 0 100px; }
    .eyebrow { color: var(--accent); font-size: .78rem; font-weight: 700; letter-spacing: .18em; }
    h1 { margin: 12px 0 18px; font-size: clamp(3rem, 9vw, 6.5rem); line-height: .98; letter-spacing: -.06em; }
    .intro { max-width: 590px; margin: 0; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.3rem); }
    .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 34px; }
    .button { display: inline-block; padding: 11px 18px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); text-decoration: none; background: var(--panel); }
    .button.primary { border-color: transparent; color: #0b1020; background: var(--accent); }
    .button:hover { transform: translateY(-1px); }
    footer { padding: 0 0 28px; color: var(--muted); font-size: .85rem; }
    @media (max-width: 560px) { .shell { width: min(100% - 28px, 960px); } nav { padding-top: 20px; } .nav-links { gap: 14px; } }
  </style>
</head>
<body>
  <div class="shell">
    <nav>
      <a class="brand" href="/">HVNT3R</a>
      <div class="nav-links">
        <a href="/blog/">Blog</a>
        <a href="/tools/">Tools</a>
      </div>
    </nav>
    <main class="hero">
      <div>
        <div class="eyebrow">PERSONAL SPACE</div>
        <h1>Keep exploring.</h1>
        <p class="intro">这里是 Hvnt3r 的个人站点。博客内容已经迁移到 Blog，工具页面则为后续的静态小工具预留。</p>
        <div class="actions">
          <a class="button primary" href="/blog/">进入博客</a>
          <a class="button" href="/tools/">查看工具区</a>
        </div>
      </div>
    </main>
    <footer>© Hvnt3r</footer>
  </div>
</body>
</html>
